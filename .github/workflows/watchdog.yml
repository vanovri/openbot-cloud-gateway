name: OpenBot gateway recovery watchdog

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['OpenBot 24x7 Cloud Gateway']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: openbot-recovery-watchdog
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Keep one gateway cycle active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ops/watchdog.py
